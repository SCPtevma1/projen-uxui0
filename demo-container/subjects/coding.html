  <!-- นำเข้าฟอนต์ Prompt เพื่อความสวยงามสดใส -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/popo/coding.css">

<body>

  <!-- ปุ่มย้อนกลับ -->
  <div class="top-nav">
    <a class="subject-page__back" href="../student.html">← กลับไปหน้ารวมรายวิชา</a>
  </div>

  <main class="content-container">
    <!-- ส่วนหัวข้อบทเรียน -->
    <div class="pro02-1">
      <h2>ฝึกคิดเป็นระบบ</h2>
      <p class="sub-title">ทำความเข้าใจแนวคิดการเขียนโปรแกรม ตั้งแต่พื้นฐานที่จำเป็น จาก 0-100</p>
      <p class="highlight-text">รวม 10 บทเรียนตั้งแต่พื้นฐานจนไปสร้างโปรเจกต์เองได้เลย 🚀</p>
    </div>

  
    <div class="dsvc-sdd">
      <div class="button-grid">


        <div class="tooltip-wrapper" data-tooltip="HTML: โครงสร้างหลักในการสร้างหน้าเว็บ">
          <button class="learn-more btn-html">
            <a href="/demo-container/subjects/Enter the lesson/HTML.HTML">HTML</a>
          </button>
        </div>

  
        <div class="tooltip-wrapper" data-tooltip="CSS: ตกแต่งสีสัน เลย์เอาต์ และดีไซน์หน้าเว็บ">
          <button class="learn-more btn-css">
            <a href="/demo-container/subjects/Enter the lesson/CSS.HTML">CSS</a>
          </button>
        </div>

  
        <div class="tooltip-wrapper" data-tooltip="JavaScript: เพิ่มลูกเล่น การตอบสนอง และฟังก์ชัน">
          <button class="learn-more btn-js">
            <a href="/demo-container/subjects/Enter the lesson/JavaScript.HTML">JS</a>
          </button>
        </div>


        <div class="tooltip-wrapper" data-tooltip="Python: ไวยากรณ์ง่าย เหมาะสำหรับ AI และ Data">
          <button class="learn-more btn-python">
            <a href="/demo-container/subjects/Enter the lesson/Pyton.HTML">Python</a>
          </button>
        </div>

  
        <div class="tooltip-wrapper" data-tooltip="ภาษา C: พื้นฐานโครงสร้างโปรแกรมและการจัดการหน่วยความจำ">
          <button class="learn-more btn-c">
            <a href="/demo-container/subjects/Enter the lesson/C.HTML">C</a>
          </button>
        </div>


        <div class="tooltip-wrapper" data-tooltip="C++: ภาษาประสิทธิภาพสูง สำหรับเกมและระบบใหญ่">
          <button class="learn-more btn-cpp">
            <a href="/demo-container/subjects/Enter the lesson/C++.HTML">C++</a>
          </button>
        </div>

     
        <div class="tooltip-wrapper" data-tooltip="ภาษา R: เหมาะสำหรับงานวิเคราะห์สถิติและข้อมูล">
          <button class="learn-more btn-r">
            <a href="/demo-container/subjects/Enter the lesson/R.HTML">R</a>
          </button>
        </div>

     
        <div class="tooltip-wrapper" data-tooltip="SQL: ภาษาสำหรับจัดการและดึงข้อมูลในฐานข้อมูล">
          <button class="learn-more btn-sql">
            <a href="/demo-container/subjects/Enter the lesson/SQL.HTML">SQL</a>
          </button>
        </div>

 
        <div class="tooltip-wrapper" data-tooltip="PHP: พัฒนาระบบหลังบ้าน (Backend) ของเว็บไซต์">
          <button class="learn-more btn-php">
            <a href="/demo-container/subjects/Enter the lesson/PHP.HTML">PHP</a>
          </button>
        </div>

      </div>
    </div>
